[project]
name = "voice-gateway"
version = "0.1.0"
description = "WebRTC media gateway for the CPU-hosted browser voice assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiortc>=1.9",
    "av>=12.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "webrtcvad-wheels==2.0.14.post1",
]

[project.optional-dependencies]
moonshine = [
    "moonshine-voice>=0.1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "detect-secrets==1.5.0",
]

[project.scripts]
voice-gateway = "gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
