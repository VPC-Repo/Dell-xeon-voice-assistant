<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b11" />
  <title>Enterprise Voice</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b11;
      --bg-soft: #0c111b;
      --panel: rgba(20, 25, 36, 0.92);
      --panel-solid: #151a25;
      --panel-2: #1b2230;
      --text: #f5f6fa;
      --muted: #a3a9b8;
      --dim: #727a8d;
      --line: rgba(255, 255, 255, 0.1);
      --mint: #51e6c2;
      --blue: #789dff;
      --violet: #a58dff;
      --danger: #ff626d;
      --danger-soft: rgba(255, 98, 109, 0.18);
      --state-a: #8ea8ff;
      --state-b: #6654dc;
      --state-c: #30246f;
      --glow: rgba(116, 149, 255, 0.25);
      --level: 0;
      --orb-scale: 1;
      --halo-opacity: 0.68;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      color: var(--text);
      background:
        radial-gradient(75% 48% at 50% 42%, var(--glow), transparent 72%),
        linear-gradient(165deg, var(--bg-soft), var(--bg) 58%);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 0.55s ease;
    }

    body[data-state="listening"] {
      --state-a: #68efd0;
      --state-b: #21b391;
      --state-c: #0c584f;
      --glow: rgba(60, 222, 185, 0.19);
    }

    body[data-state="connecting"],
    body[data-state="transcribing"],
    body[data-state="thinking"] {
      --state-a: #ac9aff;
      --state-b: #735ddd;
      --state-c: #342878;
      --glow: rgba(137, 113, 255, 0.2);
    }

    body[data-state="speaking"] {
      --state-a: #c4a3ff;
      --state-b: #8062e9;
      --state-c: #3d2a8e;
      --glow: rgba(139, 112, 255, 0.23);
    }

    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px;
    }

    /* ---- voice stage ---- */
    #stage {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(1rem + env(safe-area-inset-top)) 1.25rem 1rem;
      text-align: center;
    }

    #state-eyebrow {
      min-height: 1rem;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    #orb-tap {
      position: relative;
      width: min(57vmin, 15.5rem);
      aspect-ratio: 1;
      margin-top: clamp(1.25rem, 4vh, 2rem);
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    body.connected #orb-tap { cursor: default; }

    #orb-tap::before {
      content: "";
      position: absolute;
      inset: -13%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow), transparent 67%);
      filter: blur(0.8rem);
      opacity: var(--halo-opacity);
      transform: scale(var(--orb-scale));
      pointer-events: none;
      transition: background 0.5s ease, opacity 0.2s ease;
    }

    #orb {
      position: absolute;
      inset: 7.5%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 50%;
      box-shadow: 0 1.4rem 3.8rem rgba(0, 0, 0, 0.24);
      transform: scale(var(--orb-scale));
      transition: filter 0.45s ease, transform 0.12s ease;
    }

    /* The gradient face + drifting highlights live in their own clipping
       layer: iOS Safari fails to clip animated blend-mode children with
       overflow:hidden + border-radius alone (the blobs painted outside
       the circle), and putting a mask on #orb itself would clip away its
       outer drop shadow. The radial-gradient mask is fully opaque -- it
       exists only to force WebKit to build a proper clip layer. */
    #orb-liquid {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 27%, rgba(255, 255, 255, 0.43), transparent 20%),
        radial-gradient(circle at 70% 70%, var(--state-c), transparent 49%),
        linear-gradient(145deg, var(--state-a), var(--state-b) 54%, var(--state-c));
      box-shadow:
        inset 0.75rem 1rem 2.2rem rgba(255, 255, 255, 0.09),
        inset -1.1rem -1.4rem 2.3rem rgba(8, 9, 20, 0.29);
      transform: translateZ(0);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      isolation: isolate;
      pointer-events: none;
      transition: background 0.5s ease;
    }

    /* Drifting waves as the pseudo-elements' OWN backgrounds, moved via
       background-position: iOS Safari promotes transform-animated
       blend-mode children to compositor layers that ignore every parent
       clip (overflow, mask, clip-path), but background paint can never
       leave its own element's border-radius. Contained by construction. */
    #orb-liquid::before, #orb-liquid::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      mix-blend-mode: screen;
      pointer-events: none;
      background-repeat: no-repeat;
    }

    /* Near-hard gradient stops give the crisp "glass surface" arcs of
       the original blobs; large position travel + size oscillation make
       the drift clearly visible (fully soft gradients moved but read as
       static sheen). */
    #orb-liquid::before {
      opacity: 0.5;
      background-image: radial-gradient(72% 58% at 50% 44%, rgba(205, 225, 255, 0.5) 53%, rgba(205, 225, 255, 0) 57%);
      background-size: 190% 175%;
      background-position: 8% 0%;
      animation: drift-a 9s ease-in-out infinite alternate;
    }

    #orb-liquid::after {
      opacity: 0.45;
      background-image: radial-gradient(66% 55% at 50% 56%, rgba(95, 226, 214, 0.4) 51%, rgba(95, 226, 214, 0) 55%);
      background-size: 185% 180%;
      background-position: 94% 100%;
      animation: drift-b 7.5s ease-in-out infinite alternate;
    }

    body[data-state="disconnected"] #orb {
      filter: saturate(0.72) brightness(0.82);
    }

    body.muted-on #orb {
      filter: saturate(0.12) brightness(0.62);
      transform: scale(0.93);
    }

    body[data-state="listening"] #orb { animation: breathe 2.2s ease-in-out infinite; }
    body[data-state="speaking"] #orb { animation: speak 0.9s ease-in-out infinite alternate; }
    /* "think" rotates slightly; applied to the liquid surface only (not
       #orb, whose children include #orb-label) so "Connecting…" text
       never sways. */
    body[data-state="connecting"] #orb-liquid,
    body[data-state="transcribing"] #orb-liquid,
    body[data-state="thinking"] #orb-liquid { animation: think 3.1s ease-in-out infinite; }

    #orb-label {
      position: relative;
      z-index: 2;
      max-width: 9rem;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      user-select: none;
    }

    body.connected #orb-label { display: none; }

    #wave {
      position: relative;
      z-index: 2;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.32rem;
    }

    #wave span {
      width: 0.2rem;
      height: 1.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      transform: scaleY(0.34);
      animation: wave 0.8s ease-in-out infinite alternate;
    }

    #wave span:nth-child(2) { animation-delay: -0.18s; }
    #wave span:nth-child(3) { animation-delay: -0.38s; }
    #wave span:nth-child(4) { animation-delay: -0.12s; }
    #wave span:nth-child(5) { animation-delay: -0.3s; }

    body[data-state="listening"] #wave,
    body[data-state="speaking"] #wave { display: flex; }

    #status {
      min-height: 1.7rem;
      margin-top: clamp(1.2rem, 3.5vh, 1.9rem);
      font-size: clamp(1.35rem, 4vw, 1.65rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      user-select: none;
    }

    #status-detail {
      width: min(100%, 20rem);
      min-height: 2.5rem;
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    /* ---- transcript (opt-in via settings) ---- */
    #transcript {
      width: min(100%, 34rem);
      max-height: 18dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.65rem;
      padding: 0.35rem;
      mask-image: linear-gradient(transparent, #000 12%);
    }
    #transcript[hidden] { display: none; }

    .line {
      max-width: 88%;
      padding: 0.5rem 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.055);
      white-space: pre-wrap;
      text-align: left;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .line.user { align-self: flex-end; background: rgba(105, 132, 194, 0.18); }
    .line.assistant { align-self: flex-start; }
    .line.system { align-self: center; border: 0; background: transparent; color: var(--muted); font-size: 0.72rem; }

    /* ---- explicit conversation controls ---- */
    #controls {
      align-self: center;
      width: min(calc(100% - 2rem), 23rem);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      margin: 0 auto calc(1rem + env(safe-area-inset-bottom));
      padding: 0.72rem 1rem;
      border: 1px solid var(--line);
      border-radius: 1.75rem;
      background: rgba(17, 22, 32, 0.73);
      box-shadow: 0 1rem 2.8rem rgba(0, 0, 0, 0.25), inset 0 1px rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(1.35rem);
      -webkit-backdrop-filter: blur(1.35rem);
    }

    .ctl {
      justify-self: center;
      display: inline-grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, transform 0.12s ease, opacity 0.2s ease;
    }
    .ctl:active:not(:disabled) { transform: scale(0.94); }
    .ctl:disabled { opacity: 0.3; cursor: default; }
    .ctl svg { width: 1.25rem; height: 1.25rem; }

    #end-call {
      width: 3.8rem;
      height: 3.8rem;
      border-color: transparent;
      background: var(--danger);
      box-shadow: 0 0.65rem 1.8rem var(--danger-soft);
    }
    #end-call svg { width: 1.45rem; height: 1.45rem; }
    #end-call:disabled { background: rgba(255, 255, 255, 0.065); box-shadow: none; }

    body.muted-on #mute {
      background: var(--danger-soft);
      border-color: rgba(255, 98, 109, 0.3);
      color: #ffb2b8;
    }
    .icon-alt { display: none; }
    body.muted-on #mute .icon-main { display: none; }
    body.muted-on #mute .icon-alt { display: block; }

    /* ---- settings sheet ---- */
    #backdrop {
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(2, 4, 8, 0.58);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #sheet {
      position: fixed;
      left: 0.65rem;
      right: 0.65rem;
      bottom: 0.65rem;
      z-index: 5;
      max-height: min(82dvh, 40rem);
      overflow-y: auto;
      padding: 0.65rem 1.2rem calc(1.25rem + env(safe-area-inset-bottom));
      border: 1px solid var(--line);
      border-radius: 1.8rem;
      background: rgba(21, 26, 37, 0.98);
      box-shadow: 0 -1.3rem 4rem rgba(0, 0, 0, 0.4);
      transform: translateY(calc(100% + 1.5rem));
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
    }

    #sheet::before {
      content: "";
      display: block;
      width: 2.15rem;
      height: 0.24rem;
      margin: 0 auto 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    body.sheet-open #backdrop { opacity: 1; pointer-events: auto; }
    body.sheet-open #sheet { transform: translateY(0); }

    #sheet h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 0.55rem;
      font-size: 1.05rem;
      font-weight: 600;
    }

    #sheet-close {
      display: inline-grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.065);
      color: var(--muted);
      cursor: pointer;
    }

    .row { display: flex; flex-direction: column; gap: 0.45rem; padding: 0.78rem 0; }
    .row[hidden] { display: none; }
    .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.075); }
    .row label, .row .lbl { color: #d9dce5; font-size: 0.78rem; }
    .row select {
      width: 100%;
      padding: 0.62rem 0.72rem;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      background: var(--panel-2);
      color: var(--text);
      appearance: none;
    }
    .row.h { flex-direction: row; align-items: center; justify-content: space-between; gap: 0.75rem; }

    #perf-wrap { display: flex; align-items: center; gap: 0.6rem; color: var(--muted); font-size: 0.72rem; }
    #perf { flex: 1; accent-color: var(--mint); }
    #perf-name { min-width: 4.8rem; color: var(--mint); font-size: 0.78rem; font-style: normal; text-align: right; text-transform: capitalize; }

    .switch { position: relative; width: 2.7rem; height: 1.5rem; flex: none; }
    .switch input { position: absolute; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .knob { position: absolute; inset: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); pointer-events: none; transition: background 0.2s; }
    .knob::after { content: ""; position: absolute; top: 0.13rem; left: 0.13rem; width: 1.12rem; height: 1.12rem; border-radius: 50%; background: var(--muted); transition: transform 0.2s, background 0.2s; }
    .switch input:checked + .knob { border-color: var(--mint); background: var(--mint); }
    .switch input:checked + .knob::after { transform: translateX(1.16rem); background: #fff; }

    #devices-info, #conn-info { color: var(--muted); font-size: 0.72rem; line-height: 1.5; overflow-wrap: anywhere; }

    /* ---- toast ---- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(6.7rem + env(safe-area-inset-bottom));
      z-index: 7;
      max-width: min(90vw, 26rem);
      padding: 0.58rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--panel-solid);
      color: var(--text);
      font-size: 0.78rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 0.5rem);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.err { border-color: rgba(255, 98, 109, 0.34); color: #ffb4ba; }

    @media (min-width: 640px) {
      #sheet {
        left: 50%; right: auto; bottom: 50%;
        width: 27rem;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 50%) scale(0.97);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      body.sheet-open #sheet { opacity: 1; pointer-events: auto; transform: translate(-50%, 50%) scale(1); }
    }

    @media (max-height: 680px) {
      #stage { justify-content: flex-start; padding-top: calc(0.8rem + env(safe-area-inset-top)); }
      #orb-tap { width: min(43dvh, 13rem); margin-top: 0.8rem; }
      #status { margin-top: 0.8rem; }
      #status-detail { min-height: 1.5rem; }
      #transcript { max-height: 13dvh; }
    }

    @media (max-width: 350px) {
      #controls { width: calc(100% - 1.2rem); gap: 0.7rem; margin-bottom: calc(0.6rem + env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }

    @keyframes drift-a { to { background-position: 88% 64%; background-size: 215% 192%; } }
    @keyframes drift-b { to { background-position: 8% 38%; background-size: 205% 198%; } }
    @keyframes breathe { 50% { transform: scale(1.025); } }
    @keyframes think { 50% { transform: rotate(4deg) scale(0.975); } }
    @keyframes speak { to { transform: scale(1.02); } }
    @keyframes wave { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
  </style>
</head>
<body data-state="disconnected">
  <main id="stage">
    <div id="state-eyebrow">On-device voice assistant</div>
    <button id="orb-tap" aria-label="Click to connect">
      <span id="orb">
        <span id="orb-liquid" aria-hidden="true"></span>
        <span id="orb-label">Click to connect</span>
        <span id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
      </span>
    </button>
    <div id="status" aria-live="polite">Ready when you are</div>
    <div id="status-detail">A private voice assistant running on your server.</div>
    <div id="transcript" aria-live="polite" hidden></div>
  </main>

  <footer id="controls" aria-label="Conversation controls">
    <button id="mute" class="ctl" disabled aria-label="Mute microphone">
      <svg class="icon-main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      <svg class="icon-alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
    </button>
    <button id="end-call" class="ctl" disabled aria-label="End conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.64 0l2.41 2.41a2 2 0 0 0 2.83 0l1.15-1.15a2 2 0 0 0 .16-2.64C18.73 9.2 15.55 8 12 8S5.27 9.2 3.13 11.93a2 2 0 0 0 .16 2.64l1.15 1.15a2 2 0 0 0 2.83 0l2.41-2.41Z"/></svg>
    </button>
    <button id="settings-btn" class="ctl" aria-label="Open voice settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    </button>
  </footer>

  <div id="backdrop"></div>
  <section id="sheet" role="dialog" aria-modal="true" aria-label="Voice settings">
    <h2>Voice settings <button id="sheet-close" aria-label="Close settings">✕</button></h2>

    <div class="row">
      <label for="mic-select">Microphone</label>
      <select id="mic-select"></select>
    </div>

    <div class="row" id="voice-row" hidden>
      <label for="voice-select">Assistant voice</label>
      <select id="voice-select"></select>
    </div>

    <div class="row">
      <span class="lbl" title="Stable adds stronger echo and noise rejection. Fast favors the shortest response time.">Conversation robustness</span>
      <div id="perf-wrap">
        <span>Resilient</span>
        <input id="perf" type="range" min="0" max="2" step="1" value="1" aria-label="Conversation robustness" />
        <span>Responsive</span>
        <em id="perf-name">balanced</em>
      </div>
    </div>

    <div class="row h">
      <span class="lbl">Live captions</span>
      <span class="switch">
        <input id="show-transcript" type="checkbox" aria-label="Show live captions" />
        <span class="knob"></span>
      </span>
    </div>

    <div class="row">
      <span class="lbl">Audio devices</span>
      <div id="devices-info">—</div>
    </div>

    <div class="row">
      <span class="lbl">Connection</span>
      <div id="conn-info">Not connected</div>
    </div>
  </section>

  <div id="toast" role="status"></div>
  <audio id="player" autoplay></audio>
  <script src="app.js"></script>
</body>
</html>
