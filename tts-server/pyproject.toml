[project]
name = "tts-server"
version = "0.1.0"
description = "Streaming CPU TTS server for the voice assistant (Kokoro-82M)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]

[project.scripts]
tts-server = "tts_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_server"]
